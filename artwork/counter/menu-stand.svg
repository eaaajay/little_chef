<svg xmlns="http://www.w3.org/2000/svg" width="220" height="250" viewBox="0 0 220 250">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e5b36d"/><stop offset=".55" stop-color="#b87a40"/><stop offset="1" stop-color="#87532f"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffdf3"/><stop offset="1" stop-color="#ead9b9"/></linearGradient>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="2" seed="9" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale=".65"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
