    <rect x="62" y="38" width="96" height="125" rx="4" fill="url(#paper)" stroke="#a78258" stroke-width="3"/>
    <path d="M70 47 H150" stroke="#fffdf4" stroke-width="3" opacity=".75"/>
    <rect x="40" y="174" width="140" height="50" rx="7" fill="url(#wood)"/>
    <path d="M51 188 H169" stroke="#e3b67c" stroke-width="3" opacity=".55"/>
    <rect x="78" y="203" width="64" height="7" rx="3.5" fill="#74482d" opacity=".5" stroke="none"/>
    <circle cx="110" cy="29" r="6" fill="#e9c98f" stroke="#76503a" stroke-width="2"/>
    <!-- Blank card: no text, no skew, no rotation. -->
