<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#75615a"/><stop offset=".5" stop-color="#4d4142"/><stop offset="1" stop-color="#302c31"/></linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#6c5750"/><stop offset="1" stop-color="#332c31"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffdf4"/><stop offset="1" stop-color="#e9dcc5"/></linearGradient>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="12" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale=".65" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <ellipse cx="180" cy="273" rx="135" ry="12" fill="#63472f" opacity=".16" filter="url(#blur)"/>
  <g filter="url(#wc)" stroke="#493431" stroke-width="4" stroke-linejoin="round">
    <!-- Straight, level monitor back. The display itself faces the kitchen. -->
    <rect x="58" y="28" width="244" height="122" rx="16" fill="url(#body)"/>
    <rect x="70" y="40" width="220" height="98" rx="9" fill="#514448" stroke="#827068" stroke-width="2.5"/>
    <path d="M82 48 H278" stroke="#a38b7a" stroke-width="2" opacity=".42"/>
    <path d="M82 130 H278" stroke="#2c282d" stroke-width="3" opacity=".65"/>
    <g stroke="#29262b" stroke-width="4" opacity=".65"><path d="M94 78H150"/><path d="M94 89H150"/><path d="M94 100H150"/><path d="M94 111H150"/></g>
    <g fill="#b5a08d" stroke="#392f32" stroke-width="1.5"><circle cx="82" cy="52" r="3"/><circle cx="278" cy="52" r="3"/><circle cx="82" cy="126" r="3"/><circle cx="278" cy="126" r="3"/></g>
    <circle cx="220" cy="89" r="20" fill="#3a3338" stroke="#8e786b" stroke-width="2.5"/>
    <circle cx="220" cy="89" r="8" fill="#8f7a68" opacity=".55" stroke="none"/>
    <path d="M216 89 L220 85 L224 89 L220 93Z" fill="#d2bb96" stroke="none" opacity=".75"/>
    <!-- Centered stand -->
    <path d="M145 148 H215 L229 207 H131Z" fill="url(#body)"/>
    <path d="M155 151 H205 L213 197 H147Z" fill="#7b665c" opacity=".35" stroke="none"/>
    <rect x="115" y="195" width="130" height="22" rx="10" fill="#4a3d3d"/>
    <!-- Level cash drawer -->
    <rect x="50" y="207" width="260" height="58" rx="12" fill="url(#base)"/>
    <rect x="61" y="220" width="238" height="33" rx="5" fill="#3b3337" stroke="#766059" stroke-width="2.5"/>
    <path d="M70 226 H290" stroke="#8a7366" stroke-width="2" opacity=".55"/>
    <rect x="151" y="233" width="58" height="8" rx="4" fill="#211f24" stroke="#756059" stroke-width="2"/>
    <circle cx="286" cy="214" r="4" fill="#7ea586" stroke="#d3c39e" stroke-width="1.5"/>
    <!-- Receipt printer, also level -->
    <rect x="246" y="160" width="62" height="61" rx="9" fill="url(#body)"/>
    <rect x="258" y="126" width="30" height="43" rx="3" fill="url(#paper)" stroke="#aa9476" stroke-width="2"/>
    <path d="M253 177 H301" stroke="#1f2024" stroke-width="5"/>
    <path d="M258 199 H296" stroke="#8b7568" stroke-width="2" opacity=".55"/>
    <path d="M62 207 H294" stroke="#d1b89b" stroke-width="2" opacity=".28"/>
